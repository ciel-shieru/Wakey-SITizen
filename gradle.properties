# Gradle JVM
# The D8 dex archiver needs a large heap to merge the dependency dex archives
# (Hilt, Compose, Room, Work, DataStore). The default 512m causes
# `java.lang.OutOfMemoryError: Java heap space` in :app:mergeExtDexDebug.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
