name: Android CI

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager_bin="$(command -v sdkmanager)"
          else
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager_bin"
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses
          set -o pipefail
          # Android 17 / API 37 is published as android-37.0 on the preview channel.
          "$sdkmanager_bin" --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          # The project currently declares compileSdk = 37; provide the legacy SDK path
          # expected by Gradle/AGP versions that do not resolve the minor-version name.
          if [[ ! -d "$sdk_root/platforms/android-37" ]]; then
            ln -sfn android-37.0 "$sdk_root/platforms/android-37"
          fi

      - name: Run Android lint
        run: ./gradlew app:lint

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager_bin="$(command -v sdkmanager)"
          else
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager_bin"
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses
          set -o pipefail
          # Android 17 / API 37 is published as android-37.0 on the preview channel.
          "$sdkmanager_bin" --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          # The project currently declares compileSdk = 37; provide the legacy SDK path
          # expected by Gradle/AGP versions that do not resolve the minor-version name.
          if [[ ! -d "$sdk_root/platforms/android-37" ]]; then
            ln -sfn android-37.0 "$sdk_root/platforms/android-37"
          fi

      - name: Run JVM unit tests
        run: ./gradlew test

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager_bin="$(command -v sdkmanager)"
          else
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager_bin"
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses
          set -o pipefail
          # Android 17 / API 37 is published as android-37.0 on the preview channel.
          "$sdkmanager_bin" --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          # The project currently declares compileSdk = 37; provide the legacy SDK path
          # expected by Gradle/AGP versions that do not resolve the minor-version name.
          if [[ ! -d "$sdk_root/platforms/android-37" ]]; then
            ln -sfn android-37.0 "$sdk_root/platforms/android-37"
          fi

      - name: Build debug APK
        run: ./gradlew app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wakey-sitizen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
